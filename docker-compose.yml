version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: msu_mysql_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mesa_servicios_unmsm
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/01_schema_mysql.sql:/docker-entrypoint-initdb.d/01_schema.sql
    networks:
      - msu-net

  frontend:
    build: .
    container_name: msu_frontend_web
    ports:
      - "80:80"
    depends_on:
      - db
    networks:
      - msu-net

volumes:
  mysql_data:

networks:
  msu-net:
    driver: bridge
