global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/alertas.yml"

scrape_configs:
  - job_name: "msu-backend"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 5s
    static_configs:
      - targets: ["backend:8080"]
        labels:
          application: "msu-backend"
          entorno: "docker"

