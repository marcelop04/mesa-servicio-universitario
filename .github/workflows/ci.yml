# AX08 · Compila y ejecuta las pruebas en cada pull request y en cada push a main.
# Un pull request con pruebas fallidas queda marcado en rojo.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Pruebas (H2 en modo MySQL con las migraciones reales)
        run: mvn -B test
      - name: Reporte de pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Pruebas (Vitest)
        run: npm test
      - name: Compilación
        run: npm run build

  docker:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Construir backend y frontend
        run: docker compose build

  api-tests:
    name: Pruebas de API (Newman)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Preparar .env para Docker Compose
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            cat << 'EOF' > .env
          MYSQL_ROOT_PASSWORD=demo_root_password_12345
          DB_USER=msu
          DB_PASSWORD=demo_db_password_12345
          DATOS_DEMO=true
          DEMO_PASSWORD=Demo12345!
          JWT_SECRET=super_secret_jwt_key_of_at_least_32_bytes_len
          EOF
          fi
          sed -i 's/^DB_PASSWORD=.*$/DB_PASSWORD=demo_db_password_12345/' .env || echo "DB_PASSWORD=demo_db_password_12345" >> .env
          sed -i 's/^MYSQL_ROOT_PASSWORD=.*$/MYSQL_ROOT_PASSWORD=demo_root_password_12345/' .env || echo "MYSQL_ROOT_PASSWORD=demo_root_password_12345" >> .env
          sed -i 's/^JWT_SECRET=.*$/JWT_SECRET=super_secret_jwt_key_of_at_least_32_bytes_len/' .env || echo "JWT_SECRET=super_secret_jwt_key_of_at_least_32_bytes_len" >> .env
          sed -i 's/^DEMO_PASSWORD=.*$/DEMO_PASSWORD=Demo12345!/' .env || echo "DEMO_PASSWORD=Demo12345!" >> .env
          sed -i 's/^DATOS_DEMO=.*$/DATOS_DEMO=true/' .env || echo "DATOS_DEMO=true" >> .env
      - name: Levantar stack con Docker Compose
        run: docker compose up -d --build
      - name: Esperar disponibilidad de la API
        run: |
          for i in {1..60}; do
            if curl -s -f http://localhost:8080/api/v1/auth/csrf > /dev/null; then
              echo "API lista tras $i intentos"
              break
            fi
            echo "Esperando API ($i/60)..."
            sleep 2
          done
      - name: Instalar dependencias de pruebas
        working-directory: tests/api
        run: npm ci || npm install
      - name: Ejecutar pruebas de API con Newman
        working-directory: tests/api
        run: npm test
      - name: Publicar reporte de pruebas de API
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: tests/api/reportes/
