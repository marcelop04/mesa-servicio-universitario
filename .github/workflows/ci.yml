# AX08 · Compila y ejecuta las pruebas en cada pull request y en cada push a main.
# Un pull request con pruebas fallidas queda marcado en rojo.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Pruebas (H2 en modo MySQL con las migraciones reales)
        run: mvn -B test
      - name: Reporte de pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Pruebas (Vitest)
        run: npm test
      - name: Compilación
        run: npm run build

  npm-audit:
    name: npm audit (incluye desarrollo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Fallar si hay vulnerabilidades altas o críticas
        working-directory: frontend
        run: npm audit --audit-level=high --json > npm-audit.json
      - name: Conservar resultado incluso si el análisis falla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit
          path: frontend/npm-audit.json

  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/cache@v4
        with:
          path: ~/.m2/dependency-check-data
          key: dependency-check-13-${{ runner.os }}-${{ github.run_id }}
          restore-keys: dependency-check-13-${{ runner.os }}-
      - name: Comprobar la clave de NVD sin mostrarla
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo '::error::Configure el secret NVD_API_KEY. No se considera aprobado un análisis que no pudo consultar NVD.'
            exit 1
          fi
      - name: Analizar dependencias (CVSS >= 7 bloquea)
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B -Pseguridad dependency-check:check
      - name: Conservar los informes disponibles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check
          path: backend/target/dependency-check-report.*
          if-no-files-found: warn

  docker:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend, npm-audit, dependency-check]
    steps:
      - uses: actions/checkout@v4
      - name: Construir backend y frontend
        # Construir no necesita credenciales de ejecución ni evaluar el .env de Compose.
        run: |
          docker build -t msu-backend:ci ./backend
          docker build -t msu-frontend:ci ./frontend
