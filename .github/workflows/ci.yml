# AX08 · Compila y ejecuta las pruebas en cada pull request y en cada push a main.
# Un pull request con pruebas fallidas queda marcado en rojo.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Pruebas (H2 en modo MySQL con las migraciones reales)
        run: mvn -B test
      - name: Reporte de pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Pruebas (Vitest)
        run: npm test
      - name: Compilación
        run: npm run build

  npm-audit:
    name: npm audit (incluye desarrollo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Fallar si hay vulnerabilidades altas o críticas
        working-directory: frontend
        run: npm audit --audit-level=high --json > npm-audit.json
      - name: Auditar también las herramientas npm incorporadas por main
        working-directory: docs/pruebas
        run: npm audit --audit-level=high --json > npm-audit.json
      - name: Conservar resultado incluso si el análisis falla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit
          path: |
            frontend/npm-audit.json
            docs/pruebas/npm-audit.json

  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/cache@v4
        with:
          path: ~/.m2/dependency-check-data
          # Separar la base completa del feed de descargas API incompletas.
          key: dependency-check-13-nvd-feed-${{ runner.os }}-${{ github.run_id }}
          restore-keys: dependency-check-13-nvd-feed-${{ runner.os }}-
      - name: Analizar dependencias (CVSS >= 7 bloquea)
        working-directory: backend
        # Feed 2.0 del propio NIST, admitido por Dependency-Check 13. No requiere
        # API key; conserva actualización automática, failOnError y CVSS del POM.
        run: >-
          mvn -B -Pseguridad
          "-DnvdDatafeedUrl=https://nvd.nist.gov/feeds/json/cve/2.0/nvdcve-2.0-{0}.json.gz"
          -DconnectionTimeout=15000 -DreadTimeout=120000 dependency-check:check
      - name: Conservar los informes disponibles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check
          path: backend/target/dependency-check-report.*
          if-no-files-found: warn

  docker:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend, npm-audit, dependency-check]
    steps:
      - uses: actions/checkout@v4
      - name: Credenciales efímeras para Compose (sin secretos predeterminados)
        run: >-
          python3 despliegue/scripts/crear-entorno.py --host prueba.example.org
          --email pruebas@example.org --perfil prueba --demo --salida .env
      - name: Construir backend y frontend
        run: docker compose -f docker-compose.yml -f despliegue/compose.ci.yml build
      - name: Validar Caddy (sin solicitar certificados)
        run: >-
          docker run --rm -e APP_HOST=prueba.example.org -e ACME_EMAIL=pruebas@example.org
          -v "$PWD/despliegue/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Validar Nginx con las cabeceras y healthcheck integrados
        run: docker run --rm --add-host backend:127.0.0.1 msu-frontend:prueba nginx -t
      - name: C1 · Cabeceras e IP real en proxy aislado (sin nube ni base de datos)
        run: python3 docs/pruebas/proxy-seguridad.py --frontend msu-frontend:prueba
      - name: RNF11 · Copia, pérdida y restauración de MySQL y evidencias
        run: bash despliegue/scripts/probar-recuperacion.sh

  despliegue:
    name: Configuración de despliegue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pruebas del generador y del cálculo SUS
        run: python -m unittest discover -s despliegue/tests -v
      - name: C3 · Validación de autorización y alcance DAST (sin escanear)
        run: python -m unittest discover -s docs/pruebas -p "test_seguridad_*.py" -v
      - name: ShellCheck
        run: >-
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable
          --external-sources -P despliegue/scripts despliegue/scripts/*.sh
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - name: Validar infraestructura (no crea recursos)
        working-directory: despliegue/infra
        run: |
          terraform fmt -check
          terraform init -backend=false -input=false
          terraform validate
