<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mesa de Servicios Universitarios | UNMSM</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Encabezado Estilo Institucional UNMSM -->
  <header class="app-header">
    <div class="header-brand">
      <button id="btn-menu-toggle" class="btn-icon mobile-only" aria-label="Abrir menú" aria-expanded="false" hidden>
        ☰
      </button>
      <div class="header-logo-text">
        <span class="univ-subtitle">Universidad Nacional Mayor de San Marcos</span>
        <h1 class="app-title">Mesa de Servicios Universitarios</h1>
      </div>
    </div>

    <div class="header-actions">
      <button id="btn-reset-demo" class="btn btn-outline-light btn-sm" title="Restablecer datos iniciales de la demostración">
        Restablecer demo
      </button>
      <div id="user-badge" class="user-badge" hidden>
        <span id="user-name" class="user-name"></span>
        <span id="user-role" class="badge-role"></span>
        <button id="btn-logout" class="btn btn-danger-subtle btn-sm">Cerrar sesión</button>
      </div>
    </div>
  </header>

  <!-- Contenedor global de alertas -->
  <div id="global-alert-container" class="alert-container" aria-live="polite"></div>

  <!-- Cuerpo principal: Navegación + Contenido -->
  <div class="app-layout">
    <aside id="app-sidebar" class="app-sidebar" hidden>
      <div class="sidebar-heading">Módulos operativos</div>
      <nav aria-label="Navegación principal">
        <ul id="nav-list" class="nav-list"></ul>
      </nav>
    </aside>

    <main id="app-content" class="app-content" tabindex="-1">
      <!-- Contenido dinámico -->
    </main>
  </div>

  <footer class="app-footer">
    <p>Facultad de Ingeniería de Sistemas e Informática (FISI) · UNMSM © 2026</p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
