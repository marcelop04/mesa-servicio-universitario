# Stack de Observabilidad para la Mesa de Servicios Universitarios (D6).
# Levantar en conjunto con el docker-compose base:
#   docker compose -f docker-compose.yml -f docker-compose.observabilidad.yml up --build
#
# Seguridad (RNF02):
#   - Puertos restringidos a la interfaz de bucle local (127.0.0.1) para evitar exposición en redes públicas.
#   - Receptores OTLP (4317/4318) permanecen en la red interna de Docker sin exposición al host.
#   - Contraseña administrativa de Grafana configurable por variable de entorno (GRAFANA_ADMIN_PASSWORD).

services:
  # Extiende el backend para inyectar la URL interna del colector de trazas
  backend:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      SIMULACION_HABILITADA: ${SIMULACION_HABILITADA:-false}
    depends_on:
      jaeger:
        condition: service_started

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: msu-jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    # Solo expone la interfaz web en localhost; los puertos OTLP 4317/4318 quedan solo en la red interna
    ports:
      - "127.0.0.1:16686:16686"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: msu-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observabilidad/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observabilidad/prometheus/alertas.yml:/etc/prometheus/alertas.yml:ro
      - prometheus-datos:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.2.0
    container_name: msu-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Defina GRAFANA_ADMIN_PASSWORD en el entorno}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./observabilidad/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observabilidad/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observabilidad/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-datos:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus-datos:
  grafana-datos:
