# Stack de Observabilidad para la Mesa de Servicios Universitarios (D6).
# Levantar en conjunto con el docker-compose base:
#   docker compose -f docker-compose.yml -f docker-compose.observabilidad.yml up --build
#
# Servicios expuestos:
#   - Prometheus UI:  http://localhost:9090
#   - Jaeger UI:      http://localhost:16686
#   - Grafana UI:     http://localhost:3000 (admin / admin)

services:
  # Extiende el backend para inyectar la URL del colector de trazas Jaeger
  backend:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      jaeger:
        condition: service_started

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: msu-jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Interfaz Web de Jaeger
      - "4317:4317"   # Receptor OTLP gRPC
      - "4318:4318"   # Receptor OTLP HTTP

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: msu-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observabilidad/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observabilidad/prometheus/alertas.yml:/etc/prometheus/alertas.yml:ro
      - prometheus-datos:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.2.0
    container_name: msu-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./observabilidad/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observabilidad/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observabilidad/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-datos:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus-datos:
  grafana-datos:

