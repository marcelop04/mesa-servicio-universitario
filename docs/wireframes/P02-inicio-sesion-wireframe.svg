<text x="1438" y="126" font-size="16" font-weight="bold" fill="#000">Notas de diseño (tabla 22)</text>
<circle cx="1450" cy="157" r="12" fill="#000"/>
<text x="1450" y="161.5" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
<text x="1472" y="162" font-size="13" fill="#222222">Separa las credenciales de la navegación</text>
<text x="1472" y="180" font-size="13" fill="#222222">operativa: pantalla pública sin menú lateral</text>
<text x="1472" y="198" font-size="13" fill="#222222">ni datos de casos.</text>
<circle cx="1450" cy="227" r="12" fill="#000"/>
<text x="1450" y="231.5" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
<text x="1472" y="232" font-size="13" fill="#222222">Un solo mensaje de error genérico; no indica</text>
<text x="1472" y="250" font-size="13" fill="#222222">si falló el correo o la contraseña.</text>
<circle cx="1450" cy="279" r="12" fill="#000"/>
<text x="1450" y="283.5" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
<text x="1472" y="284" font-size="13" fill="#222222">Enlace visible al registro (P01), que solo</text>
<text x="1472" y="302" font-size="13" fill="#222222">crea cuentas de solicitante.</text>
<circle cx="1450" cy="331" r="12" fill="#000"/>
<text x="1450" y="335.5" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
<text x="1472" y="336" font-size="13" fill="#222222">Etiquetas visibles, marca de obligatorio y</text>
<text x="1472" y="354" font-size="13" fill="#222222">foco visible al usar el teclado.</text>
