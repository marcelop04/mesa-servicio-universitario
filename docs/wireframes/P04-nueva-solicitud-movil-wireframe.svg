<text x="52" y="270" font-size="12" fill="#222222" text-anchor="start" font-weight="bold">(!) Revisa 1 campo antes de enviar</text>
<text x="52" y="287" font-size="12" fill="#222222" text-anchor="start">• Descripción del problema</text>
