<text x="204.0" y="1407.0" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">Registrar solicitud</text>
<rect x="40" y="1436" width="328" height="44" rx="5" fill="#fff" stroke="#222222" stroke-width="1.4"/>
<text x="204.0" y="1463.0" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">Cancelar</text>
