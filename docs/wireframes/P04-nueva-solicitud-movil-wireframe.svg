<text x="40" y="355" font-size="13" fill="#222222" text-anchor="start" font-weight="bold">Categoría *</text>
<rect x="40" y="362" width="328" height="36" rx="4" fill="#fff" stroke="#666666" stroke-width="1.2"/>
<text x="50" y="385.0" font-size="13" fill="#222222" text-anchor="start">Software académico</text>
<text x="350" y="385.0" font-size="13" fill="#666666" text-anchor="start">▾</text>
<text x="40" y="423" font-size="13" fill="#222222" text-anchor="start" font-weight="bold">Ubicación *</text>
<rect x="40" y="430" width="328" height="36" rx="4" fill="#fff" stroke="#666666" stroke-width="1.2"/>
<text x="50" y="453.0" font-size="13" fill="#222222" text-anchor="start">Pab. B · Lab. cómputo 1</text>
<text x="350" y="453.0" font-size="13" fill="#666666" text-anchor="start">▾</text>
<text x="40" y="491" font-size="13" fill="#222222" text-anchor="start" font-weight="bold">Referencia (opcional)</text>
<rect x="40" y="498" width="328" height="36" rx="4" fill="#fff" stroke="#666666" stroke-width="1.2"/>
<text x="50" y="521.0" font-size="13" fill="#222222" text-anchor="start">Equipos de la fila 3</text>
<text x="40" y="551" font-size="12" fill="#666666" text-anchor="start">Hasta 200 caracteres.</text>
<line x1="40" y1="570" x2="368" y2="570" stroke="#bdbdbd" stroke-width="1.2"/>
<text x="40" y="598" font-size="15" fill="#222222" text-anchor="start" font-weight="bold">2. Descripción del problema</text>
<text x="40" y="623" font-size="13" fill="#222222" text-anchor="start" font-weight="bold">Describe qué ocurre *</text>
<rect x="40" y="630" width="328" height="90" rx="4" fill="#fff" stroke="#222222" stroke-width="2"/>
<text x="50" y="652" font-size="13" fill="#222222" text-anchor="start">No abre el SPSS</text>
<text x="40" y="737" font-size="12" fill="#222222" text-anchor="start" font-weight="bold">(!) Mínimo 20 caracteres.</text>
<text x="368" y="756" font-size="12" fill="#666666" text-anchor="end">15 / 2000</text>
<line x1="40" y1="768" x2="368" y2="768" stroke="#bdbdbd" stroke-width="1.2"/>
<text x="40" y="796" font-size="15" fill="#222222" text-anchor="start" font-weight="bold">3. Afectación</text>
<text x="40" y="824" font-size="13" fill="#222222" text-anchor="start" font-weight="bold">Impacto *</text>
<circle cx="48" cy="850" r="8" fill="#fff" stroke="#666666" stroke-width="1.3"/>
<text x="64" y="855" font-size="13" fill="#222222" text-anchor="start">Alto</text>
<text x="64" y="872" font-size="12" fill="#666666" text-anchor="start">varias aulas o servicio compartido</text>
<circle cx="48" cy="894" r="8" fill="#fff" stroke="#666666" stroke-width="1.3"/>
<circle cx="48" cy="894" r="4" fill="#222222"/>
<text x="64" y="899" font-size="13" fill="#222222" text-anchor="start" font-weight="bold">Medio</text>
<text x="64" y="916" font-size="12" fill="#666666" text-anchor="start">un aula o grupo</text>
<circle cx="48" cy="938" r="8" fill="#fff" stroke="#666666" stroke-width="1.3"/>
<text x="64" y="943" font-size="13" fill="#222222" text-anchor="start">Bajo</text>
<text x="64" y="960" font-size="12" fill="#666666" text-anchor="start">una persona</text>
<text x="40" y="990" font-size="13" fill="#222222" text-anchor="start" font-weight="bold">Urgencia *</text>
<circle cx="48" cy="1016" r="8" fill="#fff" stroke="#666666" stroke-width="1.3"/>
<circle cx="48" cy="1016" r="4" fill="#222222"/>
<text x="64" y="1021" font-size="13" fill="#222222" text-anchor="start" font-weight="bold">Alta</text>
<text x="64" y="1038" font-size="12" fill="#666666" text-anchor="start">actividad detenida sin alternativa</text>
<circle cx="48" cy="1060" r="8" fill="#fff" stroke="#666666" stroke-width="1.3"/>
<text x="64" y="1065" font-size="13" fill="#222222" text-anchor="start">Media</text>
<text x="64" y="1082" font-size="12" fill="#666666" text-anchor="start">con alternativa temporal</text>
<circle cx="48" cy="1104" r="8" fill="#fff" stroke="#666666" stroke-width="1.3"/>
<text x="64" y="1109" font-size="13" fill="#222222" text-anchor="start">Baja</text>
<text x="64" y="1126" font-size="12" fill="#666666" text-anchor="start">puede programarse</text>
<rect x="40" y="1148" width="328" height="104" rx="6" fill="#e4e4e4" stroke="#222222" stroke-width="2"/>
<text x="54" y="1174" font-size="15" fill="#222222" text-anchor="start" font-weight="bold">Prioridad inicial: Alta</text>
<text x="54" y="1198" font-size="12" fill="#222222" text-anchor="start">Impacto Medio × Urgencia Alta</text>
<text x="54" y="1220" font-size="12" fill="#222222" text-anchor="start">Primera atención: 8 h · Resolución: 48 h</text>
<text x="54" y="1240" font-size="11" fill="#666666" text-anchor="start">El supervisor puede corregirla con motivo.</text>
<text x="40" y="1286" font-size="15" fill="#222222" text-anchor="start" font-weight="bold">4. Evidencias (opcional)</text>
<rect x="40" y="1300" width="328" height="60" rx="4" fill="#fff" stroke="#666666" stroke-width="1.2" stroke-dasharray="6 4"/>
