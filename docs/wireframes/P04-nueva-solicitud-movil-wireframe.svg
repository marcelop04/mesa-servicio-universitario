<rect x="414" y="92" width="300" height="1418" fill="#fafafa" stroke="#666666" stroke-dasharray="6 4"/>
<text x="432" y="126" font-size="16" font-weight="bold" fill="#000">Notas de diseño (tabla 22)</text>
<circle cx="444" cy="157" r="12" fill="#000"/>
<text x="444" y="161.5" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
<text x="466" y="162" font-size="13" fill="#222222">Menú compacto: la navegación lateral</text>
<text x="466" y="180" font-size="13" fill="#222222">se contrae en un botón de menú.</text>
<circle cx="444" cy="209" r="12" fill="#000"/>
<text x="444" y="213.5" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
<text x="466" y="214" font-size="13" fill="#222222">Una sola columna en el mismo orden:</text>
<text x="466" y="232" font-size="13" fill="#222222">dónde y qué, descripción, afectación,</text>
<text x="466" y="250" font-size="13" fill="#222222">prioridad y evidencias.</text>
<circle cx="444" cy="279" r="12" fill="#000"/>
<text x="444" y="283.5" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
<text x="466" y="284" font-size="13" fill="#222222">Errores junto al campo y resumen</text>
<text x="466" y="302" font-size="13" fill="#222222">arriba, igual que en escritorio.</text>
<circle cx="444" cy="331" r="12" fill="#000"/>
<text x="444" y="335.5" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
<text x="466" y="336" font-size="13" fill="#222222">Botones principales a todo el ancho; el</text>
<text x="466" y="354" font-size="13" fill="#222222">envío se desactiva durante la petición.</text>
