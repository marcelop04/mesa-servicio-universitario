<text x="1472" y="354" font-size="13" fill="#222222">Resumen de errores arriba del formulario; el</text>
<text x="1472" y="372" font-size="13" fill="#222222">foco pasa a él cuando el envío falla.</text>
<circle cx="1450" cy="401" r="12" fill="#000"/>
<text x="1450" y="405.5" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">5</text>
