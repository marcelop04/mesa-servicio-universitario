<text x="1472" y="214" font-size="13" fill="#222222">Luego descripción y afectación (impacto y</text>
<text x="1472" y="232" font-size="13" fill="#222222">urgencia con ejemplos); las evidencias van</text>
<text x="1472" y="250" font-size="13" fill="#222222">al final y son opcionales.</text>
