# Configuración por variables de entorno (RNF02: secretos fuera del repositorio).
# DB_PASSWORD y JWT_SECRET son obligatorios incluso en local; ver scripts/preparar-entorno.ps1.
spring:
  application:
    name: msu-backend
  profiles:
    default: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      # HU06: imágenes de hasta 5 MB (el servicio vuelve a comprobarlo).
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    time-zone: UTC
    # Mismos nombres que el diccionario de datos y la API simulada del prototipo (sección 12.4).
    property-naming-strategy: SNAKE_CASE

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /swagger-ui.html
    # Maven filtra esta propiedad del POM para que la ruta coincida con el WebJar actualizado.
    version: "@swagger-ui.version@"

msu:
  jwt:
    # DV04: JWT en cookie HttpOnly. En despliegue JWT_SECRET debe ser un valor aleatorio de 32 bytes o más.
    secreto: ${JWT_SECRET}
    duracion: ${JWT_DURACION:PT2H}
    cookie-segura: ${COOKIE_SECURE:false}
  seguridad:
    # David debe activarlo en la nube; exige cookies seguras y desactiva la siembra de cuentas demo.
    despliegue: ${SEGURIDAD_DESPLIEGUE:false}
    login:
      max-fallos: ${LOGIN_MAX_FALLOS:5}
      max-fallos-ip: ${LOGIN_MAX_FALLOS_IP:50}
      ventana: ${LOGIN_VENTANA:PT15M}
      max-contadores: ${LOGIN_MAX_CONTADORES:10000}
      # Lista CIDR de proxies que SOBRESCRIBEN X-Real-IP. Vacía = no confiar en cabeceras.
      proxies-confiables: ${LOGIN_PROXIES_CONFIABLES:}
  tareas:
    # EM03: revisión del cierre automático a las 72 horas (RNF07: cada cinco minutos).
    habilitadas: ${TAREAS_HABILITADAS:true}
    cierre-automatico: ${CIERRE_INTERVALO:PT5M}
    # HU15: revisión de plazos (aviso al 80 % y escalamiento al vencer).
    alertas-plazos: ${ALERTAS_INTERVALO:PT5M}
    # HU02: borra las revocaciones de tokens que ya vencieron.
    limpieza-sesiones: ${LIMPIEZA_SESIONES_INTERVALO:PT1H}
  archivos:
    # Evidencias fuera de la carpeta pública (RNF11: en Docker es un volumen persistente).
    directorio: ${ARCHIVOS_DIR:./archivos}
  datos-demo:
    # GB07: crea una cuenta de prueba por rol si no existen. Desactivar en despliegues reales.
    habilitado: ${DATOS_DEMO:false}
    password: ${DEMO_PASSWORD:}
    # MR07: solicitudes de ejemplo para la bandeja de supervisión, solo si la base no tiene ninguna.
    solicitudes: ${DATOS_DEMO_SOLICITUDES:false}
  simulacion:
    # D5: Endpoints de simulación de incidentes RNF08. Desactivado por defecto (seguridad).
    habilitada: ${SIMULACION_HABILITADA:false}

# Observabilidad (Paquete D: Actuator, Micrometer, Prometheus, OpenTelemetry y Jaeger)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      sla:
        http.server.requests: 100ms, 500ms, 1s
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://jaeger:4318/v1/traces}
