spring:
  datasource:
    url: jdbc:h2:mem:msu;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:

msu:
  jwt:
    # Clave ficticia exclusiva de H2/pruebas. Nunca se usa en la configuración de ejecución.
    secreto: clave-ficticia-solo-para-pruebas-automatizadas-32-bytes
    cookie-segura: false
  seguridad:
    despliegue: false
    login:
      # El contexto compartido de pruebas inicia muchas sesiones; se prueban límites bajos por separado.
      max-fallos-ip: 10000
      max-fallos: 5
      ventana: PT15M
      proxies-confiables: ''
  tareas:
    # Las pruebas ejecutan el cierre automático con un instante controlado.
    habilitadas: false
  archivos:
    directorio: target/archivos-prueba
  datos-demo:
    habilitado: true
    password: Demo12345!
    # Cada prueba crea sus propias solicitudes con SolicitudesDePrueba.
    solicitudes: false
